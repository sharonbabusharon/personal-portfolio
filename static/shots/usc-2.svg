<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafaf8"/>
      <stop offset="1" stop-color="#f1f3fb"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect width="1280" height="800" fill="url(#bg2)"/>

  <text x="80" y="104" font-size="20" fill="#1e3a8a" font-family="'JetBrains Mono', monospace" letter-spacing="3">SCHEMA-DRIVEN UI</text>
  <text x="80" y="154" font-size="38" font-weight="700" fill="#17181a">JSON config &#8594; auto-resolved foreign keys</text>

  <!-- Left: JSON config card -->
  <rect x="80" y="230" width="470" height="360" rx="14" fill="#17181a"/>
  <circle cx="112" cy="264" r="6" fill="#ff5f57"/><circle cx="134" cy="264" r="6" fill="#febc2e"/><circle cx="156" cy="264" r="6" fill="#28c840"/>
  <text x="420" y="269" font-size="14" fill="#8b8d94" font-family="'JetBrains Mono', monospace">module.json</text>
  <g font-family="'JetBrains Mono', monospace" font-size="21">
    <text x="108" y="330" fill="#c3d0f0">"vendor_id"<tspan fill="#8b8d94">: {</tspan></text>
    <text x="140" y="366" fill="#8b8d94">"type"<tspan fill="#e6e5e0">: </tspan><tspan fill="#7fd88f">"reference"</tspan><tspan fill="#8b8d94">,</tspan></text>
    <text x="140" y="402" fill="#8b8d94">"table"<tspan fill="#e6e5e0">: </tspan><tspan fill="#7fd88f">"vendors"</tspan><tspan fill="#8b8d94">,</tspan></text>
    <text x="140" y="438" fill="#8b8d94">"display"<tspan fill="#e6e5e0">: </tspan><tspan fill="#7fd88f">"vendor_name"</tspan></text>
    <text x="108" y="474" fill="#8b8d94">}</text>
  </g>
  <text x="108" y="548" font-size="16" fill="#8b8d94" font-family="'JetBrains Mono', monospace">no hand-written form code</text>

  <!-- Arrow -->
  <line x1="560" y1="410" x2="700" y2="410" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="566" y="392" font-size="16" fill="#1e3a8a" font-weight="600">autogenerates</text>
  <text x="566" y="440" font-size="14" fill="#74767c" font-family="'JetBrains Mono', monospace">FK resolved</text>

  <!-- Right: generated form with open dropdown -->
  <rect x="720" y="230" width="480" height="360" rx="14" fill="#ffffff" stroke="#d5d4cd"/>
  <text x="752" y="278" font-size="17" fill="#74767c" font-family="'JetBrains Mono', monospace">Purchase Order &#183; New</text>
  <text x="752" y="322" font-size="16" fill="#43454a">Vendor</text>
  <!-- select box -->
  <rect x="752" y="336" width="416" height="46" rx="9" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="770" y="365" font-size="18" fill="#17181a">Gulf Supplies LLC</text>
  <path d="M1140 353l10 10 10-10" fill="none" stroke="#1e3a8a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- open dropdown list pulled from vendors table -->
  <rect x="752" y="388" width="416" height="176" rx="9" fill="#ffffff" stroke="#d5d4cd"/>
  <rect x="752" y="388" width="416" height="44" fill="#eaeefb"/>
  <text x="770" y="416" font-size="17" fill="#1e3a8a" font-weight="600">Gulf Supplies LLC</text>
  <text x="770" y="460" font-size="17" fill="#43454a">Acme Trading Co.</text>
  <text x="770" y="504" font-size="17" fill="#43454a">Emirates Hardware</text>
  <text x="770" y="548" font-size="17" fill="#43454a">Nova Distribution</text>
  <text x="1050" y="416" font-size="13" fill="#74767c" font-family="'JetBrains Mono', monospace">&#8592; vendors</text>

  <text x="80" y="656" font-size="17" fill="#43454a">A reference field in config becomes a live lookup wired to the related table &#8212; automatically.</text>
</svg>
